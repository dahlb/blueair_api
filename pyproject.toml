[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blueair_api"
authors = [
    { name = "Bren Dahl", email = "dahl.brendan@gmail.com" },
]
description = "Blueair Api Wrapper"
readme = "README.md"
requires-python = ">=3.14, <4"
license = "MIT"
dynamic = ["version"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
keywords = [
    "blueair",
    "api",
]
dependencies = [
    "aiohttp",
    "paho-mqtt",
]

[project.urls]
"Homepage" = "https://github.com/dahlb/blueair_api"
"Bug Tracker" = "https://github.com/dahlb/blueair_api/issues"

[dependency-groups]
lint = [
    "mypy",
    "prek",
    "ruff",
]
pytest = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-timeout",
]
dev = [
    { include-group = "lint" },
    { include-group = "pytest" },
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "blueair_api.const.VERSION" }

[tool.setuptools.package-data]
blueair_api = ["py.typed"]

[tool.mypy]
python_version = "3.14"
# Scoped to the library only: the test suite relies heavily on dynamically
# attaching extra attributes to mock callables (e.g. `.calls`, `.script`),
# which doesn't type-check without a disproportionate rewrite. mypy isn't
# run in CI (see lint.yml / prek.toml), so this only affects local `scripts/lint`.
files = ["src/blueair_api"]
mypy_path = "src"
check_untyped_defs = true
explicit_package_bases = true
pretty = true
show_error_codes = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "paho.*",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
indent-width = 4
fix = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN002",   # missing-type-args
    "ANN003",   # missing-type-kwargs
    "ANN401",   # any-type
    "ARG",      # flake8-unused-arguments
    "CPY001",	# flake8-copyright
    "EM",       # flake8-errmsg
    "ERA",      # eradicate
    "FBT",      # flake8-boolean-trap
    "PLC1901",  # {existing} can be simplified to {replacement} as an empty string is falsey; too many false positives
    "PLR0904",  # Too many public methods
    "PLR0911",  # Too many return statements ({returns} > {max_returns})
    "PLR0912",  # Too many branches ({branches} > {max_branches})
    "PLR0913",  # Too many arguments to function call ({c_args} > {max_args})
    "PLR0914",  # Too many local variables
    "PLR0915",  # Too many statements ({statements} > {max_statements})
    "PLR0916",  # Too many Boolean expressions
    "PLR0917",  # Too many positional arguments
    "PLR1702",  # Too many nested blocks
    "PLR2004",  # Magic value used in comparison, consider replacing {value} with a constant variable
    "PLW2901",  # Outer {outer_kind} variable {name} overwritten by inner {inner_kind} target
    "PT011",    # pytest.raises({exception}) is too broad, set the `match` parameter or use a more specific exception
    "PT018",    # Assertion should be broken down into multiple parts
    "RUF001",   # String contains ambiguous unicode character.
    "RUF002",   # Docstring contains ambiguous unicode character.
    "RUF003",   # Comment contains ambiguous unicode character.
    "RUF015",   # Prefer next(...) over single element slice
    "S311",     # suspicious-non-cryptographic-random-usage
    "SIM103",   # Return the condition {condition} directly
    "SIM108",   # Use ternary operator {contents} instead of if-else-block
    "SIM115",   # Use context handler for opening files
    "TC001",    # Move application import {} into a type-checking block
    "TC002",    # Move third-party import {} into a type-checking block
    "TC003",    # Move standard library import {} into a type-checking block
    "TD003",    # missing-todo-link
    "TRY003",   # Avoid specifying long messages outside the exception class
    "TRY301",   # raise-within-try
    "TRY400",   # Use `logging.exception` instead of `logging.error`

    # May conflict with the formatter, https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
    "COM812",   # missing-trailing-comma
    "COM819",   # prohibited-trailing-comma
    "D206",     # docstring-tab-indentation
    "D300",     # triple-single-quotes
    "E111",     # indentation-with-invalid-multiple
    "E114",     # indentation-with-invalid-multiple-comment
    "E117",     # over-indented
    "Q000",     # bad-quotes-inline-string
    "Q001",     # bad-quotes-multiline-string
    "Q002",     # bad-quotes-docstring
    "Q003",     # avoidable-escaped-quote
    "Q004",     # unnecessary-escaped-quote
    "W191",     # tab-indentation
]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"src/blueair_api/stub.py" = [
    "E402", # Interactive script mutates sys.path before importing the local package.
    "T201", # Interactive script intentionally prints inspected state.
]
"src/blueair_api/sku_map.py" = [
    "E501", # One SKU list per product line; wrapping would hurt readability.
]
"tests/*" = [
    "B017",    # Don't assert blind Exception
    "C90",     # mccabe, complexity
    "D1",      # Missing docstring; test names are self-documenting.
    "E501",    # line too long
    "S101",    # Use of assert detected
    "S105",    # Possible hardcoded password
    "S106",    # Possible hardcoded password assigned to argument
    "S108",    # hardcoded-temp-file
    "SLF001",  # Private member accessed
    "ANN001",  # Missing type annotation for function argument; heavy use of ad-hoc fakes/mocks.
    "ANN201",  # Missing return type annotation for public function
    "ANN202",  # Missing return type annotation for private function
    "N803",    # Argument name should be lowercase; e.g. `MockClient` class-style fixture names.
    "N806",    # Variable in function should be lowercase; same as above.
    "PLC0415", # `import` should be at the top-level of a file; common in test-local mocking.
    "INP001",  # File is part of an implicit namespace package.
    "ASYNC230", # Blocking open() of a small local JSON fixture inside an async test.
]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true
known-first-party = ["blueair_api"]
split-on-trailing-comma = false

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.codespell]
# hass: shorthand for Home Assistant used throughout this codebase.
# ot: a Blueair device-info JSON field abbreviation (configuration.df.ot).
# bu: a SenML base-field name (RFC 8428 section 4.1), used verbatim in
# intermediate_representation_aws.py's base-field detection.
ignore-words-list = "hass,ot,bu"

[tool.pytest.ini_options]
addopts = """
  --quiet
  --timeout=20
  --durations=10
  -o console_output_style=progress
  --cov=blueair_api
  --cov-report=term-missing
  --cov-report=html
"""
testpaths = ["tests"]
asyncio_mode = "auto"
# Silences pytest-asyncio's own PytestDeprecationWarning about this
# option being unset; without it, filterwarnings below turns that
# warning into a collection-time error before any test can run.
asyncio_default_fixture_loop_scope = "function"
# Surface latent NotImplemented / int(x or 0) / similar bugs while
# they are still deprecation warnings, before they become hard
# TypeErrors. bool(NotImplemented) is the canonical example:
# emitted DeprecationWarning since 3.9, raises TypeError on 3.14+.
# Treating DeprecationWarning as an error keeps the test suite
# honest across the 3.12 -> 3.14 transition.
filterwarnings = [
    "error::DeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["blueair_api"]
omit = ["src/blueair_api/stub.py"]
relative_files = true
parallel = false

[tool.coverage.report]
show_missing = true
